<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rich Wood/Bakelite Background Gradient -->
    <radialGradient id="panel-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#3d2314" />
      <stop offset="50%" stop-color="#23130a" />
      <stop offset="100%" stop-color="#120a05" />
    </radialGradient>

    <!-- Premium Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a3" />
      <stop offset="20%" stop-color="#ffd700" />
      <stop offset="40%" stop-color="#ca9e1b" />
      <stop offset="60%" stop-color="#ffd700" />
      <stop offset="80%" stop-color="#8a6508" />
      <stop offset="100%" stop-color="#443002" />
    </linearGradient>

    <!-- Dark Gold for Inset -->
    <linearGradient id="dark-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a6508" />
      <stop offset="100%" stop-color="#443002" />
    </linearGradient>

    <!-- Glowing Button Gradient (Translucent Look) -->
    <radialGradient id="button-glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#fff5cc" />
      <stop offset="50%" stop-color="#ffbb00" />
      <stop offset="80%" stop-color="#e67300" />
      <stop offset="100%" stop-color="#661100" />
    </radialGradient>

    <!-- Glass Reflection -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>

    <!-- Drop Shadow for UI Elements -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.7"/>
    </filter>

    <!-- Intense VFD Screen Glow -->
    <filter id="vfd-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComponentTransfer in="blur" result="brightBlur">
        <feFuncA type="linear" slope="1.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="brightBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Wood Grain Texture -->
    <pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse">
      <line x1="0" y1="10" x2="100" y2="10" stroke="#fff" opacity="0.02" stroke-width="1"/>
      <line x1="0" y1="35" x2="100" y2="35" stroke="#000" opacity="0.05" stroke-width="2"/>
      <line x1="0" y1="60" x2="100" y2="60" stroke="#fff" opacity="0.01" stroke-width="1.5"/>
      <line x1="0" y1="85" x2="100" y2="85" stroke="#000" opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Main Panel -->
  <rect x="10" y="10" width="580" height="580" rx="35" fill="url(#panel-bg)" stroke="url(#gold)" stroke-width="8" filter="url(#shadow)" />
  <rect x="10" y="10" width="580" height="580" rx="35" fill="url(#grain)" />
  
  <!-- Inset Bevel for Background -->
  <rect x="18" y="18" width="564" height="564" rx="30" fill="none" stroke="url(#dark-gold)" stroke-width="2" opacity="0.8" />

  <!-- Intricate Art Deco Corners -->
  <g fill="url(#gold)">
    <!-- Top Left -->
    <path d="M 10 120 L 120 10 L 80 10 L 10 80 Z" />
    <path d="M 10 60 L 60 10 L 45 10 L 10 45 Z" opacity="0.7"/>
    <circle cx="45" cy="45" r="4"/>
    
    <!-- Top Right -->
    <path d="M 590 120 L 480 10 L 520 10 L 590 80 Z" />
    <path d="M 590 60 L 540 10 L 555 10 L 590 45 Z" opacity="0.7"/>
    <circle cx="555" cy="45" r="4"/>
    
    <!-- Bottom Left -->
    <path d="M 10 480 L 120 590 L 80 590 L 10 520 Z" />
    <path d="M 10 540 L 60 590 L 45 590 L 10 555 Z" opacity="0.7"/>
    <circle cx="45" cy="555" r="4"/>
    
    <!-- Bottom Right -->
    <path d="M 590 480 L 480 590 L 520 590 L 590 520 Z" />
    <path d="M 590 540 L 540 590 L 555 590 L 590 555 Z" opacity="0.7"/>
    <circle cx="555" cy="555" r="4"/>
  </g>

  <!-- Title Branding -->
  <text x="300" y="32" fill="url(#gold)" font-family="'Cinzel', 'Times New Roman', serif" font-size="16" text-anchor="middle" font-weight="bold" letter-spacing="4">GRANDVIEW HOTEL</text>

  <!-- Display Screen Section -->
  <g filter="url(#shadow)">
    <!-- Outer Bezel -->
    <rect x="100" y="50" width="400" height="100" rx="20" fill="#0c0c0c" stroke="url(#gold)" stroke-width="4" />
    <!-- Inner Screen -->
    <rect x="110" y="60" width="380" height="80" rx="10" fill="#0a1a15" />
    
    <!-- Screen Grid and Details -->
    <path d="M 110 80 L 490 80 M 110 100 L 490 100 M 110 120 L 490 120" stroke="#003322" stroke-width="0.5" />
    <text x="120" y="75" fill="#00aa88" font-family="monospace" font-size="10">TRACK SELECT</text>
    <text x="480" y="75" fill="#00aa88" font-family="monospace" font-size="10" text-anchor="end">READY</text>
    
    <!-- Equalizer Bars (Static) -->
    <g fill="#00ffcc" opacity="0.6">
      <rect x="120" y="110" width="4" height="15" />
      <rect x="127" y="115" width="4" height="10" />
      <rect x="134" y="105" width="4" height="20" />
      <rect x="141" y="120" width="4" height="5" />
      
      <rect x="476" y="110" width="4" height="15" text-anchor="end"/>
      <rect x="469" y="115" width="4" height="10" />
      <rect x="462" y="105" width="4" height="20" />
      <rect x="455" y="120" width="4" height="5" />
    </g>

    <!-- Main Display Text -->
    <text x="300" y="118" fill="#00ffcc" font-family="'Courier New', monospace" font-size="60" text-anchor="middle" font-weight="bold" id="jukebox-display" filter="url(#vfd-glow)" letter-spacing="8">__</text>
    
    <!-- Glass Reflection on Screen -->
    <rect x="110" y="60" width="380" height="80" rx="10" fill="url(#glass)" pointer-events="none" />
  </g>

  <style>
    .svg-btn { cursor: pointer; }
    .svg-btn:hover .btn-rim { stroke: #fff; filter: drop-shadow(0 0 5px #ffd700); }
    .svg-btn:hover .btn-face { filter: brightness(1.2); }
    .svg-btn:active .btn-face { transform: scale(0.92); transform-origin: center; }
    .svg-label { pointer-events: none; font-family: 'Cinzel', 'Times New Roman', serif; }
  </style>

  <!-- Buttons Grid -->
  <g font-weight="bold" text-anchor="middle" font-size="32">
    
    <!-- Row 1: A, B, C -->
    <g class="svg-btn" data-val="A" transform="translate(150, 200)">
      <circle class="btn-rim" r="40" fill="#1a1a1a" stroke="url(#gold)" stroke-width="4" filter="url(#shadow)" />
      <circle class="btn-face" r="34" fill="url(#button-glow)" />
      <text dy="12" fill="#221100" class="svg-label">A</text>
    </g>
    <g class="svg-btn" data-val="B" transform="translate(300, 200)">
      <circle class="btn-rim" r="40" fill="#1a1a1a" stroke="url(#gold)" stroke-width="4" filter="url(#shadow)" />
      <circle class="btn-face" r="34" fill="url(#button-glow)" />
      <text dy="12" fill="#221100" class="svg-label">B</text>
    </g>
    <g class="svg-btn" data-val="C" transform="translate(450, 200)">
      <circle class="btn-rim" r="40" fill="#1a1a1a" stroke="url(#gold)" stroke-width="4" filter="url(#shadow)" />
      <circle class="btn-face" r="34" fill="url(#button-glow)" />
      <text dy="12" fill="#221100" class="svg-label">C</text>
    </g>

    <!-- Row 2: 1, 2, 3 -->
    <g class="svg-btn" data-val="1" transform="translate(150, 290)">
      <circle class="btn-rim" r="40" fill="#1a1a1a" stroke="url(#gold)" stroke-width="4" filter="url(#shadow)" />
      <circle class="btn-face" r="34" fill="url(#button-glow)" />
      <text dy="12" fill="#221100" class="svg-label">1</text>
    </g>
    <g class="svg-btn" data-val="2" transform="translate(300, 290)">
      <circle class="btn-rim" r="40" fill="#1a1a1a" stroke="url(#gold)" stroke-width="4" filter="url(#shadow)" />
      <circle class="btn-face" r="34" fill="url(#button-glow)" />
      <text dy="12" fill="#221100" class="svg-label">2</text>
    </g>
    <g class="svg-btn" data-val="3" transform="translate(450, 290)">
      <circle class="btn-rim" r="40" fill="#1a1a1a" stroke="url(#gold)" stroke-width="4" filter="url(#shadow)" />
      <circle class="btn-face" r="34" fill="url(#button-glow)" />
      <text dy="12" fill="#221100" class="svg-label">3</text>
    </g>

    <!-- Row 3: 4, 5, 6 -->
    <g class="svg-btn" data-val="4" transform="translate(150, 380)">
      <circle class="btn-rim" r="40" fill="#1a1a1a" stroke="url(#gold)" stroke-width="4" filter="url(#shadow)" />
      <circle class="btn-face" r="34" fill="url(#button-glow)" />
      <text dy="12" fill="#221100" class="svg-label">4</text>
    </g>
    <g class="svg-btn" data-val="5" transform="translate(300, 380)">
      <circle class="btn-rim" r="40" fill="#1a1a1a" stroke="url(#gold)" stroke-width="4" filter="url(#shadow)" />
      <circle class="btn-face" r="34" fill="url(#button-glow)" />
      <text dy="12" fill="#221100" class="svg-label">5</text>
    </g>
    <g class="svg-btn" data-val="6" transform="translate(450, 380)">
      <circle class="btn-rim" r="40" fill="#1a1a1a" stroke="url(#gold)" stroke-width="4" filter="url(#shadow)" />
      <circle class="btn-face" r="34" fill="url(#button-glow)" />
      <text dy="12" fill="#221100" class="svg-label">6</text>
    </g>

    <!-- Row 4: 7, 8, 9 -->
    <g class="svg-btn" data-val="7" transform="translate(150, 470)">
      <circle class="btn-rim" r="40" fill="#1a1a1a" stroke="url(#gold)" stroke-width="4" filter="url(#shadow)" />
      <circle class="btn-face" r="34" fill="url(#button-glow)" />
      <text dy="12" fill="#221100" class="svg-label">7</text>
    </g>
    <g class="svg-btn" data-val="8" transform="translate(300, 470)">
      <circle class="btn-rim" r="40" fill="#1a1a1a" stroke="url(#gold)" stroke-width="4" filter="url(#shadow)" />
      <circle class="btn-face" r="34" fill="url(#button-glow)" />
      <text dy="12" fill="#221100" class="svg-label">8</text>
    </g>
    <g class="svg-btn" data-val="9" transform="translate(450, 470)">
      <circle class="btn-rim" r="40" fill="#1a1a1a" stroke="url(#gold)" stroke-width="4" filter="url(#shadow)" />
      <circle class="btn-face" r="34" fill="url(#button-glow)" />
      <text dy="12" fill="#221100" class="svg-label">9</text>
    </g>

    <!-- Row 5: Play (Wide Button) -->
    <g class="svg-btn" data-val="SELECT" transform="translate(300, 560)">
      <rect class="btn-rim" x="-120" y="-20" width="240" height="40" rx="15" fill="#1a1a1a" stroke="url(#gold)" stroke-width="4" filter="url(#shadow)" />
      <rect class="btn-face" x="-115" y="-16" width="230" height="32" rx="12" fill="url(#button-glow)" />
      <text dy="8" fill="#221100" class="svg-label" font-size="22" letter-spacing="3">PLAY</text>
    </g>
  </g>
</svg>
