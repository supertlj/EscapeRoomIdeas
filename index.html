<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="The Grandview Hotel - An immersive escape room puzzle game">
  <title>The Grandview Hotel</title>
  <link rel="stylesheet" href="css/core.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/puzzles/KeypadPuzzle.css">
  <link rel="stylesheet" href="css/puzzles/DialPuzzle.css">
  <link rel="stylesheet" href="css/puzzles/CombinationLockPuzzle.css">
  <link rel="stylesheet" href="css/ads.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&family=Orbitron:wght@400;700&family=Share+Tech+Mono&family=Noto+Sans+SC:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/seven-segment" rel="stylesheet">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="ui-overlay">
      <div id="ui-design-container">
        <div id="top-bar">
          <button id="btn-menu" class="ui-btn" aria-label="Menu">☰</button>
          <div id="room-title"></div>
          <div style="display:flex; gap:8px;">
            <button id="btn-hint" class="ui-btn" aria-label="Hint">💡</button>
          </div>
        </div>
        <button id="btn-back" class="ui-btn hidden" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="5" x2="5" y2="19"></line>
            <polyline points="12 19 5 19 5 12"></polyline>
          </svg>
        </button>
        <div id="inventory-bar">
          <div id="inventory-slots"></div>
        </div>
        <div id="ad-space">
          <div class="ad-placeholder">
            <span class="ad-label">Advertisement</span>
            <div class="ad-content-sim">
              <div class="ad-brand">The Grandview Hotel</div>
              <div class="ad-tagline">Excellence in every stay.</div>
            </div>
          </div>
        </div>
        <div id="feedback-overlay" class="hidden">
          <div id="feedback-text"></div>
        </div>
        <div id="story-modal" class="modal hidden">
          <div class="modal-content story-content">
            <div id="story-text"></div>
            <button id="story-close" class="modal-btn">Continue</button>
          </div>
        </div>
        <div id="hint-modal" class="modal hidden">
          <div class="modal-content hint-content">
            <div class="hint-header"><span id="hint-tier-label">Hint 1 of 3</span></div>
            <div id="hint-text"></div>
            <div id="hint-actions">
              <button id="hint-watch-ad" class="modal-btn accent">Watch Ad for Hint</button>
              <button id="hint-close" class="modal-btn">Close</button>
            </div>
          </div>
        </div>
        <div id="menu-panel" class="modal hidden">
          <div class="modal-content menu-content">
            <h2 id="menu-title">The Grandview Hotel</h2>
            <button id="btn-restart-room" class="menu-btn">RESTART ROOM</button>
            <button id="btn-level-select" class="menu-btn">ROOM SELECTION</button>
            <button id="btn-language" class="menu-btn">CHINESE / ENGLISH</button>
            <button id="btn-resume" class="menu-btn primary">RESUME</button>
          </div>
        </div>
        <div id="level-select-panel" class="modal hidden">
          <div class="level-select-content">
            <h2 id="level-select-title">ROOM SELECTION</h2>
            <div id="level-grid" class="level-grid"></div>
            <button id="btn-close-levels" class="modal-btn">BACK</button>
          </div>
        </div>
        <div id="room-complete" class="modal hidden">
          <div class="modal-content complete-content">
            <div class="complete-icon">🔓</div>
            <h2 id="complete-title">Room Escaped!</h2>
            <p id="complete-text"></p>
            <button id="btn-next-room" class="modal-btn accent">Next Room</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/i18n.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/dialog.js"></script>
  <script src="js/hint-system.js"></script>
  <script src="js/puzzle-engine.js"></script>
  <script src="js/asset-loader.js"></script>
  <script src="js/sprite-manager.js"></script>
  <script src="js/rooms/BaseRoom.js"></script>
  <script src="js/puzzles/KeypadPuzzle.js"></script>
  <script src="js/puzzles/DialPuzzle.js"></script>
  <script src="js/puzzles/CombinationLockPuzzle.js"></script>
  <script src="js/AdManager.js"></script>
  <script src="js/SaveManager.js"></script>
  <script src="js/room-loader.js"></script>
  <script src="js/engine.js"></script>
</body>
</html>
